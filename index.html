<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Golf swing and putting tempo trainer. Frame-accurate beeps and lights. Works offline.">
<meta name="theme-color" content="#f2f5f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1210" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Golf Stroke Tempo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }</style>
<title>Golf Stroke Tempo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Cormorant+Garamond:ital,wght@1,500&family=Shippori+Mincho:wght@500&display=swap">
<style>
  /* Layout: one-screen phone app — dial on top, controls stacked below */
  :root {
    --bg: #f2f5f0;
    --surface: #ffffff;
    --fg: #15201a;
    --muted: #5d6a62;
    --line: #d7ded6;
    --track: #e2e8e0;
    --accent: #13824f;
    --accent-fg: #ffffff;
    --go: #17a34a; --on-go: #04210f;
    --flag: #e3a500; --on-flag: #1d1203;
    --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
    --font-body: "Noto Sans JP", system-ui, -apple-system, "Hiragino Sans", "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c1210; --surface: #141c18; --fg: #eaf0eb; --muted: #8d9b92; --line: #25312a;
      --track: #1b2620; --accent: #4fd18d; --accent-fg: #06120c;
      --go: #3ddc84; --on-go: #04210f; --flag: #ffc23d; --on-flag: #1d1203; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c1210; --surface: #141c18; --fg: #eaf0eb; --muted: #8d9b92; --line: #25312a;
    --track: #1b2620; --accent: #4fd18d; --accent-fg: #06120c;
    --go: #3ddc84; --on-go: #04210f; --flag: #ffc23d; --on-flag: #1d1203; color-scheme: dark;
  }

  /* Base rules built in, so the page looks the same outside the artifact viewer */
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  h1, p { margin: 0; }
  html, body { height: 100%; }
  body { margin: 0; font-size: 14px; line-height: 1.4; }
  .cue { display: inline-block; line-height: 1.4; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); -webkit-tap-highlight-color: transparent; }
  button, input { font: inherit; color: inherit; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app {
    max-width: 440px; margin: 0 auto; min-height: 100%;
    display: flex; flex-direction: column; gap: 18px;
    padding-block: 14px 20px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    user-select: none; -webkit-user-select: none;
  }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { font-family: var(--font-display); font-weight: 600; font-size: 22px; letter-spacing: 0.04em; text-transform: uppercase; }

  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 10px; padding: 3px; background: var(--surface); gap: 3px; }
  .seg button { border: 0; background: none; padding: 9px 6px; border-radius: 7px; font-size: 14px; font-weight: 500; cursor: pointer; color: var(--muted); white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
  .seg.small button { padding: 6px 10px; font-size: 13px; }
  .seg button[data-mode] { white-space: normal; line-height: 1.25; min-width: 0; }

  /* Dial */
  .dial { position: relative; width: min(290px, 100%); aspect-ratio: 1; max-width: 100%; margin: 4px auto 0; border: 0; background: none; cursor: pointer; border-radius: 50%; }
  .dial svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .ring-track { fill: none; stroke: var(--track); stroke-width: 14; }
  .seg-back, .seg-down { fill: none; stroke-width: 14; opacity: 0.22; }
  .seg-back, .ring-prog.back { stroke: var(--go); }
  .seg-down, .ring-prog.down { stroke: var(--flag); }
  .ring-prog { fill: none; stroke-width: 14; }
  .lamp { fill: var(--surface); }
  .dial[data-sig="ready"] .lamp { fill: color-mix(in srgb, var(--go) 26%, var(--surface)); }
  .dial[data-sig="go"] .lamp { fill: var(--go); }
  .dial[data-sig="top"] .lamp, .dial[data-sig="impact"] .lamp { fill: var(--flag); }
  .dial[data-sig="ready"] .dial-center { color: var(--fg); }
  .dial[data-sig="go"] .dial-center { color: var(--on-go); }
  .dial[data-sig="top"] .dial-center, .dial[data-sig="impact"] .dial-center { color: var(--on-flag); }
  .dial:not([data-sig="off"]) .ratio-sub, .dial:not([data-sig="off"]) .status { color: inherit; opacity: 0.8; }
  .halo { fill: var(--flag); opacity: 0; transform-origin: 140px 140px; }
  .halo.flash { animation: flash 0.45s ease-out; }
  @keyframes flash { from { opacity: 0.28; transform: scale(0.94); } to { opacity: 0; transform: scale(1.06); } }
  .mark { fill: var(--surface); stroke: var(--muted); stroke-width: 3; }
  .mark.on { fill: var(--go); stroke: var(--surface); }
  #markTop.on, .mark.impact.on { fill: var(--flag); }
  .dial-wrap { position: relative; width: min(290px, 100%); max-width: 100%; margin: 4px auto 0; }
  .dial-wrap.bar { width: 100%; }
  .dial-wrap .dial { width: 100%; margin: 0; }
  .dial.bar { aspect-ratio: auto; height: 236px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
  .dial.bar svg { display: none; }
  .dial.bar[data-sig="ready"] { background: color-mix(in srgb, var(--go) 26%, var(--surface)); }
  .dial.bar[data-sig="go"] { background: var(--go); border-color: var(--go); }
  .dial.bar[data-sig="top"], .dial.bar[data-sig="impact"] { background: var(--flag); border-color: var(--flag); }
  .dial.bar .ratio { font-size: 60px; }
  .dial.bar #cue3 { grid-column: auto; }
  .pend { position: relative; display: block; width: 86%; height: 30px; margin: 12px 0 2px; }
  .pend-track { position: absolute; inset: 0; border-radius: 15px; background: currentColor; opacity: 0.12; }
  .pend-guide { position: absolute; top: -6px; bottom: -6px; border-left: 1px dashed currentColor; opacity: 0.6; }
  .pend-guide.imp { border-left: 1.5px solid currentColor; opacity: 1; }
  .pend-fill { position: absolute; top: 7px; bottom: 7px; left: 50%; width: 0; border-radius: 3px; background: currentColor; opacity: 0.4; }
  .pend-head { position: absolute; top: 2px; bottom: 2px; left: 50%; width: 8px; margin-left: -4px; border-radius: 3px; background: currentColor; }
  .pend-caps { position: relative; display: block; width: 86%; height: 15px; font-size: 11px; opacity: 0.75; }
  .pend-caps span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  #capL { left: 10%; } #capC { left: 50%; } #capR { left: 90%; }
  .flip { position: absolute; z-index: 2; top: 6px; right: 6px; width: 40px; height: 40px; padding: 0; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--fg); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .dial-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; pointer-events: none; }
  .ratio { font-family: var(--font-display); font-weight: 700; font-size: 84px; line-height: 0.9; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
  .ratio-sub { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .status { font-size: 12px; color: var(--muted); letter-spacing: 0.02em; margin-top: 6px; }
  .cues { display: grid; grid-template-columns: auto auto; justify-content: center; justify-items: center; gap: 5px 6px; margin-top: 10px; }
  #cue3 { grid-column: 1 / -1; }
  .cue { white-space: nowrap; }
  .cue { font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .dial:not([data-sig="off"]) .cue { border-color: currentColor; color: inherit; opacity: 0.55; }
  .dial:not([data-sig="off"]) .cue.on { opacity: 1; background: var(--surface); border-color: var(--surface); color: var(--fg); }

  /* Metrics */
  .metrics { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
  .metric { padding: 9px 4px; text-align: center; display: flex; flex-direction: column; gap: 2px; }
  .metric + .metric { border-left: 1px solid var(--line); }
  .metric span { font-size: 11px; color: var(--muted); letter-spacing: 0.04em; }
  .metric strong { font-family: var(--font-display); font-weight: 600; font-size: 20px; font-variant-numeric: tabular-nums; }
  #mBack { color: var(--go); }
  #mDown { color: var(--flag); }

  .group { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .label { font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }

  .presets { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .presets button {
    aspect-ratio: 1; max-width: 100%; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface);
    font-family: var(--font-display); font-weight: 600; font-size: 19px; cursor: pointer; font-variant-numeric: tabular-nums;
  }
  .presets.wide { grid-template-columns: 1fr 1fr; }
  .presets.wide button { aspect-ratio: auto; border-radius: 999px; padding: 12px; font-size: 22px; }
  .presets.wide button small { font-size: 14px; font-weight: 500; margin-left: 4px; opacity: 0.75; }
  .presets button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }


  /* Bluetooth sync stepper */
  .row2 { display: grid; grid-template-columns: 1fr 1.3fr; gap: 10px; }
  .sync { display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 8px 8px 8px 12px; }
  .sync-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .sync-text strong { font-size: 14px; font-weight: 500; }
  .sync-text span { font-size: 12px; color: var(--muted); }
  .stepper { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .stepper button { width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); font-size: 20px; line-height: 1; cursor: pointer; }
  .stepper label { display: flex; align-items: baseline; gap: 2px; }
  .stepper input {
    width: 3.6em; text-align: right; border: 0; background: none; font-family: var(--font-display); font-weight: 600; font-size: 22px;
    font-variant-numeric: tabular-nums; user-select: text; -webkit-user-select: text; -moz-appearance: textfield; padding: 2px 0;
  }
  .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .stepper .unit { font-size: 12px; color: var(--muted); margin-right: 4px; }

  .foot { margin-top: auto; font-size: 10px; line-height: 1.5; color: var(--muted); opacity: 0.75; text-align: center; text-wrap: balance; }
  .foot strong { color: var(--fg); font-weight: 500; }

  /* ---------- Soft 3D for the controls only. The timer (circle and putting bar) is untouched. ---------- */
  :root {
    --hi: rgba(255, 255, 255, 0.95);
    --lo: rgba(52, 76, 62, 0.17);
    --raise: 3px 4px 10px var(--lo), -3px -3px 8px var(--hi);
    --press: inset 2px 2px 5px var(--lo), inset -2px -2px 5px var(--hi);
    --accent-top: color-mix(in srgb, var(--accent) 84%, #ffffff);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --hi: rgba(255, 255, 255, 0.045); --lo: rgba(0, 0, 0, 0.55); }
  }
  :root[data-theme="dark"] { --hi: rgba(255, 255, 255, 0.045); --lo: rgba(0, 0, 0, 0.55); }

  .brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .logo { width: 28px; height: 28px; flex-shrink: 0; display: block; border-radius: 8px; box-shadow: 2px 3px 6px var(--lo); }
  h1 { font-size: clamp(17px, 5.4vw, 21px); white-space: nowrap; }

  .seg { background: var(--bg); border-color: transparent; border-radius: 13px; padding: 4px; gap: 4px; box-shadow: var(--press); }
  .seg button { border-radius: 9px; }
  .seg button[aria-pressed="true"] {
    background: linear-gradient(180deg, var(--accent-top), var(--accent));
    box-shadow: 0 2px 6px var(--lo), inset 0 1px 0 rgba(255, 255, 255, 0.3);
  }

  .presets button {
    background: linear-gradient(145deg, var(--surface), var(--bg)); border: 1px solid var(--line); box-shadow: var(--raise);
  }
  .presets button:active { box-shadow: var(--press); }
  .presets button[aria-pressed="true"] {
    background: linear-gradient(180deg, var(--accent-top), var(--accent)); border-color: transparent;
    box-shadow: var(--raise), inset 0 1px 0 rgba(255, 255, 255, 0.3);
  }

  .metrics, .sync {
    background: linear-gradient(160deg, var(--surface), color-mix(in srgb, var(--surface) 60%, var(--bg)));
    border-color: transparent; border-radius: 16px; box-shadow: var(--raise);
  }
  #mBack { color: color-mix(in srgb, var(--go) 75%, var(--fg)); }
  #mDown { color: color-mix(in srgb, var(--flag) 65%, var(--fg)); }

  .stepper button { background: linear-gradient(145deg, var(--surface), var(--bg)); border-color: transparent; box-shadow: 2px 3px 6px var(--lo), -2px -2px 5px var(--hi); }
  .stepper button:active { box-shadow: var(--press); }
  .stepper input { background: var(--bg); border-radius: 9px; box-shadow: var(--press); padding: 2px 6px; }

  /* ---------- Stable layout: switching language, mode or putting view never moves anything ---------- */
  /* Putting bar is exactly as tall as the circle dial */
  .dial-wrap .dial { display: block; }
  .dial.bar { height: min(290px, calc(100vw - 32px)); }
  /* Preset buttons keep one height whether they are circles (5 across) or putting pills (2 across) */
  .presets { container-type: inline-size; }
  .presets button, .presets.wide button { aspect-ratio: auto; height: calc((100cqw - 32px) / 5); padding-block: 0; }
  /* Bluetooth card: hint text runs full width under the title, always two lines tall */
  .app > .sync { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; row-gap: 4px; align-items: center; padding: 10px 10px 12px 14px; }
  .app > .sync .sync-text { display: contents; }
  .app > .sync .sync-text strong { grid-column: 1; grid-row: 1; line-height: 20px; height: 20px; }
  .app > .sync .stepper { grid-column: 2; grid-row: 1; }
  .app > .sync .sync-text span { grid-column: 1 / -1; grid-row: 2; line-height: 17px; height: 34px; overflow: hidden; }
  /* Footer always reserves three lines */
  .foot { min-height: 4.5em; }

  /* Phone or tablet turned sideways: only the timer, as large as the screen allows. Turn back to portrait for settings.
     Kept last so these sizes win over the normal ones. Display only: timing code is unchanged. */
  @media (orientation: landscape) and (pointer: coarse), (orientation: landscape) and (hover: none), (orientation: landscape) and (max-height: 500px) {
    html, body { overflow: hidden; }
    .app { max-width: none; height: 100%; min-height: 0; display: flex; align-items: center; justify-content: center; padding-block: 10px; }
    .app > *:not(.dial-wrap) { display: none !important; }
    .app > .dial-wrap { width: min(100%, calc(100vh - 20px)); width: min(100%, calc(100dvh - 20px)); margin: 0; }
    .app > .dial-wrap.bar { width: 100%; height: 100%; }
    .dial.bar { height: 100%; }
    .ratio { font-size: clamp(64px, 24vmin, 180px); }
    .dial.bar .ratio { font-size: clamp(56px, 20vmin, 150px); }
    .ratio-sub, .status { font-size: clamp(13px, 3.2vmin, 22px); }
    .cue { font-size: clamp(11px, 2.6vmin, 18px); padding: 0.25em 0.7em; }
    .pend { width: 88%; height: clamp(30px, 10vmin, 72px); margin-block: 2vmin 0.5vmin; }
    .pend-fill { top: 24%; bottom: 24%; }
    .pend-head { width: clamp(8px, 1.6vmin, 14px); margin-left: calc(clamp(8px, 1.6vmin, 14px) / -2); }
    .pend-caps { width: 88%; font-size: clamp(11px, 2.8vmin, 18px); height: 1.4em; }
  }

  /* ================= Breathe tab: box breathing in soft pastel blue ================= */
  :root {
    /* Calm = low saturation (research: saturation drives arousal, blue is the least arousing hue, light muted colors feel most pleasant) */
    --b-bg: #edf2f5; --b-surface: #f7f9fb; --b-fg: #2b3d4c; --b-muted: #6b7d8b; --b-line: #dbe4ea;
    --b-track: #dde6ec; --b-accent: #cfdde7; --b-accent-fg: #2b3d4c; --b-trail: #8eaabd; --b-dot: #ffffff;
    --b-fill1: #e6eef3; --b-fill2: #c3d5e1; --b-lo: rgba(70, 95, 115, 0.14); --b-hi: rgba(255, 255, 255, 0.9);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --b-bg: #141b21; --b-surface: #1a232a; --b-fg: #d5e0e8; --b-muted: #8597a4; --b-line: #26323b;
      --b-track: #26323b; --b-accent: #3a4e5d; --b-accent-fg: #dbe6ee; --b-trail: #7d9cb1; --b-dot: #c9d8e3;
      --b-fill1: #1d2a33; --b-fill2: #2c4050; --b-lo: rgba(0, 0, 0, 0.5); --b-hi: rgba(255, 255, 255, 0.035);
    }
  }
  :root[data-theme="dark"] {
    --b-bg: #141b21; --b-surface: #1a232a; --b-fg: #d5e0e8; --b-muted: #8597a4; --b-line: #26323b;
    --b-track: #26323b; --b-accent: #3a4e5d; --b-accent-fg: #dbe6ee; --b-trail: #7d9cb1; --b-dot: #c9d8e3;
    --b-fill1: #1d2a33; --b-fill2: #2c4050; --b-lo: rgba(0, 0, 0, 0.5); --b-hi: rgba(255, 255, 255, 0.035);
  }
  body.tab-breathe {
    --bg: var(--b-bg); --surface: var(--b-surface); --fg: var(--b-fg); --muted: var(--b-muted); --line: var(--b-line);
    --track: var(--b-track); --accent: var(--b-accent); --accent-fg: var(--b-accent-fg); --lo: var(--b-lo); --hi: var(--b-hi);
    --accent-top: color-mix(in srgb, var(--accent) 88%, #ffffff);
    --raise: 3px 4px 10px var(--lo), -3px -3px 8px var(--hi);
    --press: inset 2px 2px 5px var(--lo), inset -2px -2px 5px var(--hi);
  }

  .tabs { width: 100%; }
  .breathe { display: none; flex-direction: column; gap: 18px; }
  body.tab-breathe .breathe { display: flex; }
  body.tab-breathe .app > :is(.dial-wrap, .metrics, .presets, .row2, .sync), body.tab-breathe .app > .seg:not(.tabs) { display: none; }

  .box-wrap {
    position: relative; display: block; width: min(330px, 100%); max-width: 100%; aspect-ratio: 1; margin: 4px auto 0; padding: 0;
    border: 0; border-radius: 34px; background: var(--surface); color: var(--fg); cursor: pointer; font: inherit;
    box-shadow: 10px 12px 26px var(--lo), -8px -8px 20px var(--hi); container-type: inline-size;
  }
  .box-wrap svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .bx-track { fill: none; stroke: none; }
  .bx-glow { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; color: var(--b-trail); }
  /* The light: a soft bead about the width of the track (no hard ring), with a faint halo */
  .bx-b1 { stop-color: var(--b-dot); } .bx-b2 { stop-color: var(--b-trail); } .bx-h1 { stop-color: var(--b-trail); stop-opacity: 0.3; } .bx-b9 { stop-opacity: 0.85; } .bx-b0 { stop-opacity: 0; }
  .bx-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; pointer-events: none; padding: 18%; text-align: center; }
  .bx-phase { font-family: var(--font-display); font-weight: 600; font-size: 26px; letter-spacing: 0.06em; text-transform: uppercase; }
  .bx-count { font-family: var(--font-display); font-weight: 700; font-size: 92px; line-height: 0.95; font-variant-numeric: tabular-nums; }
  .bx-sub { font-size: 12px; color: var(--muted); text-wrap: balance; }
  .box-wrap[data-ph="idle"] .bx-count, .box-wrap[data-ph="done"] .bx-count { font-size: 64px; }
  .box-wrap[data-ph="done"] .bx-count { display: none; }
  .bx-quote { margin: 0; min-height: 4.8em; display: flex; align-items: center; justify-content: center; text-align: center; text-wrap: balance;
    font-size: 15px; line-height: 1.6; color: var(--fg); transition: opacity 0.45s ease; white-space: pre-line; word-break: auto-phrase; }
  /* Encouragement in a soft literary serif: Cormorant Garamond italic for English, Shippori Mincho for Japanese */
  .bx-quote:not(.idle) {
    font-family: "Cormorant Garamond", "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", Georgia, serif;

  .bx-quote.idle { font-size: 13px; color: var(--muted); }
  .bx-quote.fade { opacity: 0; }
  .box-wrap[data-ph="relax"] .bx-count { display: none; }
  .bx-len { padding: 6px; }
  .bx-note { display: block; font-size: 11px; font-style: italic; line-height: 16px; height: 16px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 2px; }
  :root[lang="ja"] .bx-note { font-style: normal; }
  .bx-how { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: 16px; background: var(--surface); box-shadow: var(--raise); font-size: 13px; line-height: 1.6; color: var(--fg); }
  .bx-how strong { font-size: 13px; font-weight: 600; }

  .bx-how { min-height: 236px; }
  /* Quote area has one fixed height for the hint, every quote and both languages */

  /* Inside the box: fixed rows, so the label, number and set line never shift */

  .bx-center { display: grid; grid-template-rows: calc(var(--bx-ph) * 1.4) calc(var(--bx-ct) * 1.04) calc(var(--bx-sb) * 1.9);
    align-content: center; justify-items: center; align-items: center; gap: 0; padding: 0 12%; }
  .bx-phase { font-size: var(--bx-ph); line-height: 1; white-space: nowrap; }
  .bx-count, .box-wrap[data-ph="idle"] .bx-count, .box-wrap[data-ph="done"] .bx-count { font-size: var(--bx-ct); line-height: 1; display: block; }
  .box-wrap[data-ph="relax"] .bx-count, .box-wrap[data-ph="done"] .bx-count { visibility: hidden; }
  .box-wrap[data-ph="done"] .bx-phase { font-size: calc(var(--bx-ph) * 0.82); }
  .bx-sub { font-size: var(--bx-sb); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

<script>
(() => {
  const FPS = 30;
  // Long/short: [backswing frames, downswing frames] at 30 fps. Putting: BPM; beat 1 = takeaway, beat 2 = impact.
  const PRESETS = {
    long:  [[18, 6], [21, 7], [24, 8], [27, 9], [30, 10]],
    short: [[14, 7], [16, 8], [18, 9], [20, 10], [22, 11]],
    putt:  [80, 90]
  };
  const R = 120, C = 2 * Math.PI * R;
  const LEAD_MAX = 500, LEAD_STEP = 10;

  const I18N = {
    en: {
      title: 'Golf Stroke Tempo',
      tapStart: 'Tap to start', playing: 'Playing · tap to stop',
      cueStart: 'Takeaway', cueTop: 'Top', cueImpact: 'Impact',
      mBack: 'BACK', mStroke: 'STROKE', mDown: 'DOWN', mRest: 'REST',
      modeLong: 'Long game', modeShort: 'Short game', modePutt: 'Putting',
      lblSound: 'Sound', soundTone: 'Tone', soundBeep: 'Beep', lblRest: 'Rest',
      syncTitle: 'Bluetooth delay', syncHint: 'Fixes sound lag on wireless earbuds. Leave at 0 for wired or speaker.',
      footLocal: 'Runs entirely on your phone. No data is collected.',
      footFree: 'Public domain (CC0). Free to use and share.',
      footThanks: 'If it helps, let Hans know. He’d be very happy to hear it.',
      capBack: 'Back', capImpact: 'Impact', capFollow: 'Follow',
      viewRing: 'Circle view', viewBar: 'Bar view', viewLefty: 'Left-handed bar view',
      swing: 'swing', stroke: 'stroke'
    },
    ja: {
      title: 'Golf Stroke Tempo',
      tapStart: 'タップしてスタート', playing: '再生中（タップで停止）',
      cueStart: 'テークバック', cueTop: 'トップ', cueImpact: 'インパクト',
      mBack: 'バック', mStroke: 'ストローク', mDown: 'ダウン', mRest: 'インターバル',
      modeLong: 'フルショット', modeShort: 'アプローチ', modePutt: 'パター',
      lblSound: 'サウンド', soundTone: 'トーン', soundBeep: 'ビープ', lblRest: 'インターバル',
      syncTitle: '音ズレ補正（Bluetooth）', syncHint: 'ワイヤレスイヤホンの音の遅れを補正します。有線やスピーカーなら 0 のままで大丈夫です。',
      footLocal: 'すべて端末内で動作し、データは一切収集しません。',
      footFree: 'パブリックドメイン（CC0）です。ご自由にお使いください。',
      footThanks: '役に立ったら、ハンスに教えていただけるとすごく幸いです。',
      capBack: 'バック', capImpact: 'インパクト', capFollow: 'フォロー',
      viewRing: '円表示', viewBar: 'バー表示', viewLefty: 'レフティ用バー表示',
      swing: 'スイング', stroke: 'ストローク'
    }
  };

  const store = {
    get(k, d) { try { const v = localStorage.getItem('swingTempo.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('swingTempo.' + k, JSON.stringify(v)); } catch {} }
  };
  const defaultLang = (navigator.language || '').toLowerCase().startsWith('ja') ? 'ja' : 'en';
  const saved = store.get('settings', {});
  const state = {
    lang: saved.lang || defaultLang,
    mode: PRESETS[saved.mode] ? saved.mode : 'long',
    idx: Object.assign({ long: 4, short: 4, putt: 1 }, saved.idx),
    sound: saved.sound === 'beep' ? 'beep' : 'tone',
    rest: ['1.0', '1.6', '2.5'].includes(saved.rest) ? saved.rest : '1.6',
    puttView: ['ring', 'bar', 'lefty'].includes(saved.puttView) ? saved.puttView : 'ring',
    lead: saved.v === 2 && Number.isFinite(saved.lead) ? saved.lead : 0,
    playing: false
  };
  const save = () => store.set('settings', { lang: state.lang, mode: state.mode, idx: state.idx, sound: state.sound, rest: state.rest, lead: state.lead, puttView: state.puttView, v: 2 });

  const $ = id => document.getElementById(id);
  const t = k => I18N[state.lang][k];

  /* ---------- timing model ---------- */
  function timing() {
    const rest = Math.round(parseFloat(state.rest) * FPS) / FPS;
    if (state.mode === 'putt') {
      const bpm = PRESETS.putt[state.idx.putt];
      // Two beats only: takeaway, then impact one beat later (no top cue)
      return { putt: true, bpm, back: 60 / bpm, down: 0, rest };
    }
    const [x, y] = PRESETS[state.mode][state.idx[state.mode]];
    return { x, y, back: x / FPS, down: y / FPS, rest, bpm: 1800 / y };
  }

  /* ---------- audio engine: look-ahead scheduler on the AudioContext clock ---------- */
  let ctx = null, master = null, schedTimer = null, nextStart = 0, lastT2 = -Infinity;
  let cycles = [], rafId = 0, wakeLock = null;
  const liveNodes = new Set();
  const LOOKAHEAD = 1.6, TICK_MS = 25, READY = 0.8, IMPACT_HOLD = 0.35;

  function ensureAudio() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC({ latencyHint: 'interactive' });
      master = ctx.createGain();
      master.gain.value = 0.9;
      master.connect(ctx.destination);
      const b = ctx.createBuffer(1, 1, 22050), s = ctx.createBufferSource(); // iOS unlock
      s.buffer = b; s.connect(ctx.destination); s.start(0);
    }
    if (ctx.state !== 'running') ctx.resume();
  }

  // Context time reaching the speaker right now (measured output latency removed)
  function audibleNow() {
    if (ctx.getOutputTimestamp) {
      const ts = ctx.getOutputTimestamp();
      if (ts && ts.contextTime > 0 && ts.performanceTime > 0) {
        return ts.contextTime + (performance.now() - ts.performanceTime) / 1000;
      }
    }
    return ctx.currentTime - (ctx.outputLatency || 0) - (ctx.baseLatency || 0);
  }

  function tone(when, freq, dur, vol, type = 'triangle') {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(vol, when + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0008, when + dur);
    o.connect(g); g.connect(master);
    o.start(when); o.stop(when + dur + 0.02);
    liveNodes.add(o);
    o.onended = () => liveNodes.delete(o);
  }

  // Tone: soft D5 / A5. Beep: sharp square-wave beeps, higher and longer at impact.
  function scheduleCue(when, n) {
    if (state.sound === 'beep') {
      if (n === 3) tone(when, 2000, 0.11, 0.22, 'square');
      else tone(when, 1000, 0.06, 0.2, 'square');
    } else {
      if (n === 3) tone(when, 880, 0.14, 0.6);
      else tone(when, 587.33, 0.09, 0.5);
    }
  }

  function scheduler() {
    const horizon = ctx.currentTime + LOOKAHEAD;
    while (nextStart < horizon) {
      const p = timing();
      const t0 = nextStart, t1 = t0 + p.back, t2 = t1 + p.down;
      scheduleCue(t0, 1);
      if (p.down > 0) scheduleCue(t1, 2);
      scheduleCue(t2, 3);
      const room = t0 - (lastT2 + IMPACT_HOLD + 0.05);
      cycles.push({ t0, t1, t2, end: t2 + p.rest, readyStart: t0 - Math.max(0.15, Math.min(READY, room)) });
      if (cycles.length > 6) cycles.shift();
      lastT2 = t2;
      nextStart = t2 + p.rest; // next cycle is derived from audio time, so nothing drifts
    }
  }

  function silence() {
    clearInterval(schedTimer); schedTimer = null;
    liveNodes.forEach(o => { try { o.stop(); } catch {} });
    liveNodes.clear();
    cycles = [];
  }

  function startEngine() {
    silence();
    lastT2 = -Infinity;
    nextStart = ctx.currentTime + 0.15 + READY;
    scheduler();
    schedTimer = setInterval(scheduler, TICK_MS);
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(draw);
  }

  async function play() {
    ensureAudio();
    state.playing = true;
    startEngine();
    renderStatus();
    try { wakeLock = await navigator.wakeLock?.request('screen'); } catch { wakeLock = null; }
  }

  function stop() {
    state.playing = false;
    silence();
    cancelAnimationFrame(rafId);
    resetDial();
    try { wakeLock?.release(); } catch {}
    wakeLock = null;
    renderStatus();
  }

  const restart = () => { if (state.playing) startEngine(); };
  document.addEventListener('visibilitychange', () => { if (document.hidden && state.playing) stop(); });

  /* ---------- visuals, driven by the audio clock ---------- */
  const dial = $('dial'), ringBack = $('ringBack'), ringDown = $('ringDown'), halo = $('halo');
  let geomFrac = 0.75, lastSig = 'off';

  function setGeometry(frac) {
    geomFrac = frac;
    const a = frac * 2 * Math.PI - Math.PI / 2;
    $('markTop').setAttribute('cx', (140 + R * Math.cos(a)).toFixed(2));
    $('markTop').setAttribute('cy', (140 + R * Math.sin(a)).toFixed(2));
    const rot = `rotate(${(-90 + frac * 360).toFixed(3)} 140 140)`;
    $('segDown').setAttribute('transform', rot);
    ringDown.setAttribute('transform', rot);
    $('segBack').style.strokeDasharray = `${frac * C} ${C}`;
    $('segDown').style.strokeDasharray = `${(1 - frac) * C} ${C}`;
  }

  function setArcs(pb, pd, opacity) {
    ringBack.style.strokeDasharray = `${geomFrac * C * pb} ${C}`;
    ringDown.style.strokeDasharray = `${(1 - geomFrac) * C * pd} ${C}`;
    ringBack.style.opacity = ringDown.style.opacity = opacity;
  }

  function setSignal(sig) {
    if (sig === lastSig) return;
    lastSig = sig;
    dial.dataset.sig = sig;
    $('cue1').classList.toggle('on', sig === 'go');
    $('cue2').classList.toggle('on', sig === 'top');
    $('cue3').classList.toggle('on', sig === 'impact');
  }

  // Which light is showing at visual time v
  function signalAt(v) {
    for (let i = cycles.length - 1; i >= 0; i--) {
      const c = cycles[i];
      if (v < c.readyStart) continue;
      if (v < c.t0) return 'ready';
      if (v < c.t1) return 'go';
      if (v < c.t2) return 'top';
      if (v < c.t2 + IMPACT_HOLD) return 'impact';
      return 'off';
    }
    return 'off';
  }

    dial.classList.toggle('bar', barOn);
    $('dialWrap').classList.toggle('bar', barOn);
    $('pend').hidden = !barOn;
    $('pendCaps').hidden = !barOn;
    $('capL').textContent = pendDir > 0 ? t('capFollow') : t('capBack');
    $('capR').textContent = pendDir > 0 ? t('capBack') : t('capFollow');
    const flip = $('flip');
    flip.hidden = !putt;
    const next = VIEWS[(VIEWS.indexOf(state.puttView) + 1) % VIEWS.length];

    const f = $('pendFill');
    f.style.left = (Math.min(x, 0.5) * 100) + '%';
    f.style.width = (Math.abs(x - 0.5) * 100) + '%';

    const d = pendDir, A = PEND_A;

    if (s < beat + ft) return 0.5 - d * A * Math.sin((s - beat) / ft * Math.PI / 2);

  }

  function render() {
    document.documentElement.lang = state.lang;
    $('appTitle').textContent = t('title');
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === state.lang));
    document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === state.mode));

      $('ratioSub').textContent = `BPM · ${t('stroke')} ${total}`;
    } else {

    }

    $('markTop').hidden = !!p.putt;
    $('cue2').hidden = !!p.putt;
    $('mBack').textContent = fmt(p.back);

  });

  document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => { state.mode = b.dataset.mode; save(); render(); restart(); }));

  resetDial();
  render();
})();
</script>

      : [[300, 2, -11], [850, 2.5, -10], [1800, 3, -16]];
    bands.forEach(([f, q, db]) => {
      const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = q;
      const g = ac.createGain(); g.gain.value = Math.pow(10, db / 20);
      src.connect(bp); bp.connect(g); g.connect(sum);
    });
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = inhale ? 4800 : 2400; lp.Q.value = 0.5;
    const env = ac.createGain(); env.gain.value = 0;
    const n = 96, curve = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const x = i / (n - 1);
      const s = t => t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t);       // smoothstep
      curve[i] = inhale
        ? s(x / 0.2) * (0.88 + 0.12 * s((x - 0.2) / 0.5)) * (1 - s((x - 0.72) / 0.28))
        : s(x / 0.1) * (1 - 0.4 * s((x - 0.1) / 0.6)) * (1 - s((x - 0.7) / 0.3));
    }
    env.gain.setValueCurveAtTime(curve, when, dur);
    sum.connect(lp); lp.connect(env); env.connect(dest);
    src.start(when, Math.random() * 3); src.stop(when + dur + 0.05);
    return [src];
  }

  // Gong: low inharmonic partials with a long, smooth ring and a felt-mallet strike.
  // One clean tone per partial, so the tail fades evenly instead of wobbling.
  function gongVoice(ac, dest, buf, when, vol) {
    const out = ac.createGain(); out.gain.value = vol; out.connect(dest);
    const nodes = [], base = 110;
    [[1, 1, 9], [1.48, 0.5, 6.5], [2.02, 0.32, 5], [2.73, 0.24, 3.8], [3.51, 0.15, 2.8], [4.36, 0.1, 2.2], [5.4, 0.06, 1.6]].forEach(([r, a, dec]) => {
      const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine';
      const f = base * r;
      o.frequency.setValueAtTime(f * 1.012, when); o.frequency.exponentialRampToValueAtTime(f, when + 0.4);
      g.gain.setValueAtTime(0.0001, when); g.gain.linearRampToValueAtTime(a * 0.6, when + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, when + dec);
      o.connect(g); g.connect(out); o.start(when); o.stop(when + dec + 0.05); nodes.push(o);
    });
    const s = ac.createBufferSource(); s.buffer = buf;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, when); g.gain.linearRampToValueAtTime(0.5, when + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, when + 0.18);
    s.connect(lp); lp.connect(g); g.connect(out); s.start(when); s.stop(when + 0.2); nodes.push(s);
    return nodes;
  }

  /* ---------- audio: the whole session is pre-built as one track and played as media ----------
     A media track needs no timers, so it keeps playing with the screen locked (Android; iPhone in Safari),
     plays even with the iPhone silent switch on, and shows play / pause on the lock screen.
     Every sound sits at an exact sample position in the track, and the lights follow the track's own clock. */
  const SR = 22050, OUT_SR = 11025;   // render at 22.05 kHz, store at 11.025 kHz (breath and gong live below 5 kHz)
  const GAP0 = 0.05;                  // tiny lead-in before the opening gong
  const START = GAP0 + LEAD;          // the first inhale, in track seconds
  const TAIL = 9;                     // closing gong ring-out
  const BREATH_GAIN = 2.2, MASTER = 0.9, GONG_START = 0.5, GONG_MID = 0.38, GONG_END = 0.5;

  const player = new Audio(); player.preload = 'auto'; player.setAttribute('playsinline', '');
  let partsPromise = null, ready = null, prepToken = 0, swapToken = 0, raf = 0, wake = null;
  let running = false, finished = false, paused = false, stopping = false, swapping = false;
  let N = 0, lastSet = -1, quoteIdx = 0, anchorCT = 0, anchorPerf = 0;

  function wavBlob(x) {
    const n = x.length, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true);
    v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, OUT_SR, true); v.setUint32(28, OUT_SR * 2, true);
    v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
    const pcm = new Int16Array(buf, 44, n);
    for (let i = 0; i < n; i++) { const s = x[i] > 1 ? 1 : x[i] < -1 ? -1 : x[i]; pcm[i] = s < 0 ? s * 0x8000 : s * 0x7fff; }
    return new Blob([buf], { type: 'audio/wav' });
  }
  const SILENT = URL.createObjectURL(wavBlob(new Float32Array(1100)));

  async function renderPart(fn, dur) {
    const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const ac = new OAC(1, Math.ceil(SR * dur), SR);
    const len = SR * 4, buf = ac.createBuffer(1, len, SR), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const bus = ac.createGain(); bus.connect(ac.destination); fn(ac, bus, buf);
    const x = (await ac.startRendering()).getChannelData(0);
    const y = new Float32Array(Math.floor(x.length / 2));
    for (let i = 0; i < y.length; i++) y[i] = 0.5 * (x[2 * i] + x[2 * i + 1]);
    return y;
  }
  // Three variations of each breath, so the session never sounds looped
  function loadParts() {
    if (!partsPromise) partsPromise = (async () => {
      const inh = [], exh = [];
      for (let v = 0; v < 3; v++) {
        inh.push(await renderPart((ac, bus, buf) => { bus.gain.value = BREATH_GAIN * MASTER; breathVoice(ac, bus, buf, 0, SIDE, true); }, SIDE));
        exh.push(await renderPart((ac, bus, buf) => { bus.gain.value = BREATH_GAIN * MASTER; breathVoice(ac, bus, buf, 0, SIDE, false); }, SIDE));
      }
      const gong = await renderPart((ac, bus, buf) => { bus.gain.value = MASTER; gongVoice(ac, bus, buf, 0, 1); }, TAIL + 0.5);
      return { inh, exh, gong };
    })();
    return partsPromise;
  }
  // Session track: opening gong, then every set (a gong every 3 sets = every minute), then the closing gong after the final hold
  async function buildTrack(n) {
    const p = await loadParts();
    const total = Math.ceil((START + n * SET + TAIL) * OUT_SR), mix = new Float32Array(total);
    const add = (src, t, g = 1) => { const o = Math.round(t * OUT_SR), len = Math.min(src.length, total - o); for (let i = 0; i < len; i++) mix[o + i] += src[i] * g; };
    add(p.gong, GAP0, GONG_START);
    for (let s = 0; s < n; s++) {
      const t = START + s * SET;
      if (s > 0 && s % 3 === 0) add(p.gong, t, GONG_MID);   // every 3 sets = every minute
      add(p.inh[s % 3], t);
      add(p.exh[s % 3], t + 2 * SIDE);
    }
    add(p.gong, START + n * SET, GONG_END);
    return wavBlob(mix);
  }
  async function prepare() {
    const n = totalSets();
    if (ready && ready.n === n) return ready;
    const token = ++prepToken, blob = await buildTrack(n);
    if (token !== prepToken) return ready && ready.n === n ? ready : null;
    if (ready && ready.url !== player.src) URL.revokeObjectURL(ready.url);
    ready = { n, blob, url: URL.createObjectURL(blob) };
    return ready;
  }
  let prepTimer = 0;
  const prepareSoon = () => { clearTimeout(prepTimer); prepTimer = setTimeout(() => { prepare().catch(() => {}); }, 250); };

  /* Fallback: some viewers refuse to play a page-made track as media (strict content policies).
     Then the very same track plays through Web Audio: same sounds, same sample positions, same timing.
     Only screen-off playback is lost in that case. */
  let useWA = false, ctx = null, waGain = null, waSrc = null, waT0 = 0;
  function waEnsure() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC({ latencyHint: 'interactive' });
      waGain = ctx.createGain(); waGain.connect(ctx.destination);
      const b = ctx.createBuffer(1, 1, 22050), s = ctx.createBufferSource(); s.buffer = b; s.connect(ctx.destination); s.start(0); // iOS unlock
    }
    return ctx.state === 'running' ? Promise.resolve() : ctx.resume().catch(() => {});
  }
  function waNow() {
    if (ctx.getOutputTimestamp) {
      const ts = ctx.getOutputTimestamp();
      if (ts && ts.contextTime > 0 && ts.performanceTime > 0) return ts.contextTime + (performance.now() - ts.performanceTime) / 1000;
    }
    return ctx.currentTime - (ctx.outputLatency || 0) - (ctx.baseLatency || 0);
  }
  // Start the track at its beginning, or switch to a new track at the exact current position (seamless)
  async function waPlay(rd, keepPosition) {
    await waEnsure();
    const buf = await ctx.decodeAudioData(await rd.blob.arrayBuffer());
    const at = ctx.currentTime + 0.06, offset = keepPosition ? Math.max(0, at - waT0) : 0;
    const src = ctx.createBufferSource(); src.buffer = buf; src.connect(waGain);
    src.start(at, offset);
    if (waSrc) { try { waSrc.stop(at); } catch {} }
    waSrc = src; waT0 = at - offset;
  }
  function waStop() { if (waSrc) { try { waSrc.stop(); } catch {} waSrc = null; } }
  // Media must actually advance; some viewers accept play() but never deliver sound
  function progressing() {
    return new Promise(res => {
      const t0 = player.currentTime, s = performance.now();
      (function chk() { if (player.currentTime > t0 + 0.05) return res(true); if (performance.now() - s > 1200) return res(false); setTimeout(chk, 40); })();
    });
  }

  // Seconds into the track as heard: a smooth clock re-anchored to the player whenever they drift apart
  function trackTime() {
    if (useWA) return ctx && waSrc ? waNow() - waT0 : 0;
    const now = performance.now();
    if (swapping) return anchorCT + (now - anchorPerf) / 1000;
    const ct = player.currentTime;
    if (player.paused) { anchorCT = ct; anchorPerf = now; return ct; }
    const est = anchorCT + (now - anchorPerf) / 1000;
    if (Math.abs(ct - est) > 0.04) { anchorCT = ct; anchorPerf = now; return ct; }
    return est;
  }
  // Bluetooth delay is the value set on the Tempo tab
  const leadS = () => (window.golfTempo?.lead?.() || 0) / 1000;

  // Change the length during a session: the current set always finishes, then the track is swapped in place
  async function setTotal(newN) {
    if (!running) return;
    const cur = Math.max(0, Math.floor((trackTime() - START) / SET)) + 1;
    newN = Math.max(newN, cur);
    if (newN === N) return;
    N = newN;
    const token = ++swapToken, blob = await buildTrack(newN);
    if (token !== swapToken || !running) return;
    if (useWA) { try { await waPlay({ n: newN, blob }, true); } catch {} return; }
    const url = URL.createObjectURL(blob), old = player.src, wasPlaying = !player.paused;
    anchorCT = trackTime(); anchorPerf = performance.now(); swapping = true;
    player.src = url;
    player.addEventListener('loadedmetadata', () => {
      player.currentTime = anchorCT + (performance.now() - anchorPerf) / 1000;
      const done = () => { swapping = false; anchorCT = player.currentTime; anchorPerf = performance.now(); };
      if (wasPlaying) player.play().then(done, done); else done();
      if (old.startsWith('blob:') && (!ready || old !== ready.url)) URL.revokeObjectURL(old);
    }, { once: true });
  }

  function mediaSession(on) {
    if (!('mediaSession' in navigator)) return;
    try {
      if (on) {
        const icon = document.querySelector('link[rel="apple-touch-icon"]')?.href;
        navigator.mediaSession.metadata = new MediaMetadata({ title: tt('title'), artist: 'Golf Stroke Tempo', artwork: icon ? [{ src: icon, sizes: '180x180', type: 'image/png' }] : [] });
        navigator.mediaSession.setActionHandler('play', () => { player.play().catch(() => {}); });
        navigator.mediaSession.setActionHandler('pause', () => { player.pause(); });
        navigator.mediaSession.setActionHandler('stop', () => { if (running) stopB(false); });
      }
      navigator.mediaSession.playbackState = on ? 'playing' : 'none';
    } catch {}
  }

  async function startB() {
    cancelAnimationFrame(fadeRaf);
    running = true; finished = false; paused = false; renderIdle();
    const waReady = waEnsure();   // unlock Web Audio inside the tap too, in case media playback is refused
    const want = totalSets();
    let rd = ready && ready.n === want ? ready : null;
    if (!useWA && rd) { player.src = rd.url; player.muted = st.sound === 'off'; }
    const firstPlay = !useWA && rd ? player.play() : null;   // must start inside the tap on phones
    if (!rd) {
      if (!useWA) { player.src = SILENT; player.play().catch(() => {}); }
      txt('bxSub', tt('preparing'));
      try { rd = await prepare(); } catch { rd = null; }
      if (!running) return;
      if (!rd) { running = false; renderIdle(); return; }
    }
    N = rd.n;
    if (waGain) waGain.gain.value = st.sound === 'off' ? 0 : 1;
    if (!useWA) {
      let ok = false;
      try {
        if (!firstPlay) { player.src = rd.url; player.muted = st.sound === 'off'; await player.play(); } else await firstPlay;
        ok = await progressing();
      } catch { ok = false; }
      if (!running) return;
      if (!ok) { stopping = true; try { player.pause(); } catch {} stopping = false; useWA = true; }
    }
    if (useWA) {
      paused = false;
      try { await waReady; await waPlay(rd, false); } catch { running = false; renderIdle(); return; }
      if (!running) { waStop(); return; }
    }
    anchorCT = useWA ? 0 : player.currentTime; anchorPerf = performance.now(); lastSet = -1;
    showQuote(nextQuote(), false);
    mediaSession(!useWA);
    cancelAnimationFrame(raf); raf = requestAnimationFrame(draw);
    keepAwake();
  }

  let fadeRaf = 0, fading = false;
  const FINAL = 8;   // seconds: after the last set the trail fades out completely, with the closing gong
  function fadeLast() {
    const t0 = performance.now(), end = 4 * N * SIDE;
    fading = true;
    const step = () => {
      if (running || !finished) { fading = false; return; }
      const w = (performance.now() - t0) / 1000;
      drawTrail(end + w, end, w < FINAL ? 0.5 + 0.5 * Math.cos(Math.PI * w / FINAL) : 0);
      if (w < FINAL) fadeRaf = requestAnimationFrame(step); else fading = false;
    };
    step();
  }
  // Repaint the box whenever its size changes (tab shown, phone turned) while nothing is animating it.
  if ('ResizeObserver' in window) new ResizeObserver(() => { if (!running && !fading) drawTrail(0); }).observe(glow);
  function stopB(done) {
    running = false; finished = !!done; paused = false; swapToken++;
    cancelAnimationFrame(raf); cancelAnimationFrame(fadeRaf); fading = false;
    if (!done) { if (useWA) waStop(); else { stopping = true; player.pause(); stopping = false; } }   // when done, the closing gong rings out
    mediaSession(false);
    const w = wake; wake = null; try { w?.release(); } catch {}
    renderIdle();
    if (done) fadeLast();
    showQuote(done ? tt('doneQuote') : tt('hint'), !done);
  }

  player.addEventListener('pause', () => { if (running && !stopping && !swapping && !useWA) { paused = true; try { navigator.mediaSession.playbackState = 'paused'; } catch {} } });
  player.addEventListener('play', () => { if (running && !useWA) { paused = false; try { navigator.mediaSession.playbackState = 'playing'; } catch {} } });

  async function keepAwake() {
    if (!running || document.hidden || !('wakeLock' in navigator)) return;
    try { wake = await navigator.wakeLock.request('screen'); } catch { wake = null; }
  }

  /* ---------- encouragement: a few lines, one per set, fading in and out ---------- */
  let quoteTimer = 0, bag = [], lastQ = -1;
  function nextQuote() {
    const n = tt('quotes').length;
    if (!bag.length) {
      bag = [...Array(n).keys()];
      for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [bag[i], bag[j]] = [bag[j], bag[i]]; }
      if (bag[bag.length - 1] === lastQ && n > 1) [bag[0], bag[bag.length - 1]] = [bag[bag.length - 1], bag[0]];
    }
    lastQ = bag.pop(); quoteIdx = lastQ;
    return tt('quotes')[lastQ];
  }
  function showQuote(text, idle) {
    clearTimeout(quoteTimer);
    quote.classList.add('fade');
    quoteTimer = setTimeout(() => { quote.textContent = text; quote.classList.toggle('idle', idle); quote.classList.remove('fade'); }, 450);
  }

  const fmtTime = s => { s = Math.max(0, Math.round(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

  function draw() {
    if (!running) return;
    const e = trackTime() - leadS() - START;
    if (paused) { txt('bxSub', tt('pausedSub')); raf = requestAnimationFrame(draw); return; }
    if (e < 0) {
      box.dataset.ph = 'relax';
      txt('bxPhase', tt('relax')); txt('bxCount', ''); txt('bxSub', tt('tapStop'));
      setDot(0); drawTrail(0);
      txt('bxRounds', `0 / ${N}`); txt('bxTime', fmtTime(N * SET));
    } else {
      const k = Math.floor(e / SIDE);
      if (k >= 4 * N) { stopB(true); return; }
      const ph = k % 4, within = e - k * SIDE, p = within / SIDE, set = Math.floor(k / 4);
      const name = ['inhale', 'hold', 'exhale', 'hold'][ph];
      box.dataset.ph = name;
      txt('bxPhase', tt(name));
      txt('bxCount', String(Math.max(1, Math.ceil(SIDE - within - 1e-6))));
      txt('bxSub', tt('setOf')(set + 1, N));
      const g = glide(p);
      setDot((ph + g) * Q); drawTrail(e);
      txt('bxRounds', `${set} / ${N}`);
      txt('bxTime', fmtTime(N * SET - e));
      if (set !== lastSet) {
        if (lastSet >= 0) showQuote(nextQuote(), false);
        lastSet = set;
      }
    }
    raf = requestAnimationFrame(draw);
  }

  /* ---------- rendering ---------- */
  function renderIdle() {
    if (running) return;
    box.dataset.ph = finished ? 'done' : 'idle';
    setDot(0); drawTrail(0);
    if (finished) { txt('bxPhase', tt('done')); txt('bxCount', ''); txt('bxSub', tt('doneSub')); }
    else { txt('bxPhase', tt('title')); txt('bxCount', String(SIDE)); txt('bxSub', `${tt('perSide')} · ${tt('tap')}`); }
    const n = totalSets();
    txt('bxRounds', `0 / ${n}`);
    txt('bxTime', fmtTime(n * SET));
  }
  function renderLen() {
    const inp = $('bxInput');
    inp.min = LIMITS[st.mode][0]; inp.max = LIMITS[st.mode][1];
    if (document.activeElement !== inp) inp.value = st.mode === 'min' ? st.mins : st.sets;
    $('bxUnit').textContent = st.mode === 'min' ? tt('uMins') : tt('uSets');
    document.querySelectorAll('[data-bmode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.bmode === st.mode));
  }
  function render() {
    document.querySelectorAll('[data-b]').forEach(el => { el.textContent = tt(el.dataset.b); });
    $('bxHow').replaceChildren(...tt('how').map(line => { const li = document.createElement('li'); li.textContent = line; return li; }));
    document.querySelectorAll('[data-bsound]').forEach(b => b.setAttribute('aria-pressed', b.dataset.bsound === st.sound));
    document.querySelectorAll('[data-tab]').forEach(b => { const on = b.dataset.tab === st.tab; b.setAttribute('aria-pressed', on); b.setAttribute('aria-selected', on); });
    document.body.classList.toggle('tab-breathe', st.tab === 'breathe');
    renderLen();
    for (const k in lastTxt) delete lastTxt[k];
    if (!running) { renderIdle(); quote.textContent = finished ? tt('doneQuote') : tt('hint'); quote.classList.toggle('idle', !finished); }
    else { quote.textContent = tt('quotes')[quoteIdx]; }
  }

  function setTab(tab) {
    if (tab === st.tab) return;
    if (tab === 'breathe') window.golfTempo?.stop();
    else if (running) stopB(false);
    st.tab = tab; finished = false; save(); render();
  }

  function applyLength() {
    save(); renderLen();
    if (running) setTotal(totalSets()); else { finished = false; renderIdle(); prepareSoon(); }
  }
  function setValue(v) {
    const key = st.mode === 'min' ? 'mins' : 'sets';
    st[key] = clampTo(st.mode, v);
    applyLength();
  }

  /* ---------- events ---------- */
  box.addEventListener('click', () => { if (!running) startB(); else if (paused) player.play().catch(() => {}); else stopB(false); });
  document.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
  document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => render()));
  document.querySelectorAll('[data-bmode]').forEach(b => b.addEventListener('click', () => { st.mode = b.dataset.bmode; applyLength(); }));
  $('bxMinus').addEventListener('click', () => setValue((st.mode === 'min' ? st.mins : st.sets) - 1));
  $('bxPlus').addEventListener('click', () => setValue((st.mode === 'min' ? st.mins : st.sets) + 1));
  $('bxInput').addEventListener('change', e => setValue(e.target.value));
  $('bxInput').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
  document.querySelectorAll('[data-bsound]').forEach(b => b.addEventListener('click', () => {
    st.sound = b.dataset.bsound; save(); render();
    player.muted = st.sound === 'off';
    if (waGain) waGain.gain.value = st.sound === 'off' ? 0 : 1;
  }));
  // On the Breathe tab, the space bar controls breathing instead of the golf timer
  window.addEventListener('keydown', e => {
    if (st.tab !== 'breathe' || e.code !== 'Space' || e.target !== document.body) return;
    e.preventDefault(); e.stopPropagation(); if (!running) startB(); else if (paused) player.play().catch(() => {}); else stopB(false);
  }, true);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && running) keepAwake(); });

  render();
  setTimeout(() => { prepare().catch(() => {}); }, 800);   // pre-build the default session so the first tap starts instantly
})();
</script>

  // Offline support. Runs only over https (GitHub Pages) or localhost; opening the file directly skips it.
  if ('serviceWorker' in navigator && window.isSecureContext) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
  }
</script>
