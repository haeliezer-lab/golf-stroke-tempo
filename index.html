<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Golf swing and putting tempo trainer. Frame-accurate beeps and lights. Works offline.">
<meta name="theme-color" content="#f2f5f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1210" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stroke Tempo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }</style>
<title>Golf Stroke Tempo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  /* Layout: one-screen phone app — dial on top, controls stacked below */
  :root {
    --bg: #f2f5f0;
    --surface: #ffffff;
    --fg: #15201a;
    --muted: #5d6a62;
    --line: #d7ded6;
    --track: #e2e8e0;
    --accent: #13824f;
    --accent-fg: #ffffff;
    --go: #17a34a; --on-go: #04210f;
    --flag: #e3a500; --on-flag: #1d1203;
    --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
    --font-body: "Noto Sans JP", system-ui, -apple-system, "Hiragino Sans", "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c1210; --surface: #141c18; --fg: #eaf0eb; --muted: #8d9b92; --line: #25312a;
      --track: #1b2620; --accent: #4fd18d; --accent-fg: #06120c;
      --go: #3ddc84; --on-go: #04210f; --flag: #ffc23d; --on-flag: #1d1203; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c1210; --surface: #141c18; --fg: #eaf0eb; --muted: #8d9b92; --line: #25312a;
    --track: #1b2620; --accent: #4fd18d; --accent-fg: #06120c;
    --go: #3ddc84; --on-go: #04210f; --flag: #ffc23d; --on-flag: #1d1203; color-scheme: dark;
  }

  /* Base rules built in, so the page looks the same outside the artifact viewer */
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  h1, p { margin: 0; }
  html, body { height: 100%; }
  body { margin: 0; font-size: 14px; line-height: 1.4; }
  .cue { display: inline-block; line-height: 1.4; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); -webkit-tap-highlight-color: transparent; }
  button, input { font: inherit; color: inherit; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app {
    max-width: 440px; margin: 0 auto; min-height: 100%;
    display: flex; flex-direction: column; gap: 18px;
    padding-block: 14px 20px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    user-select: none; -webkit-user-select: none;
  }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { font-family: var(--font-display); font-weight: 600; font-size: 22px; letter-spacing: 0.04em; text-transform: uppercase; }

  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 10px; padding: 3px; background: var(--surface); gap: 3px; }
  .seg button { border: 0; background: none; padding: 9px 6px; border-radius: 7px; font-size: 14px; font-weight: 500; cursor: pointer; color: var(--muted); white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
  .seg.small button { padding: 6px 10px; font-size: 13px; }
  .seg button[data-mode] { white-space: normal; line-height: 1.25; min-width: 0; }

  /* Dial */
  .dial { position: relative; width: min(290px, 100%); aspect-ratio: 1; max-width: 100%; margin: 4px auto 0; border: 0; background: none; cursor: pointer; border-radius: 50%; }
  .dial svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .ring-track { fill: none; stroke: var(--track); stroke-width: 14; }
  .seg-back, .seg-down { fill: none; stroke-width: 14; opacity: 0.22; }
  .seg-back, .ring-prog.back { stroke: var(--go); }
  .seg-down, .ring-prog.down { stroke: var(--flag); }
  .ring-prog { fill: none; stroke-width: 14; }
  .lamp { fill: var(--surface); }
  .dial[data-sig="ready"] .lamp { fill: color-mix(in srgb, var(--go) 26%, var(--surface)); }
  .dial[data-sig="go"] .lamp { fill: var(--go); }
  .dial[data-sig="top"] .lamp, .dial[data-sig="impact"] .lamp { fill: var(--flag); }
  .dial[data-sig="ready"] .dial-center { color: var(--fg); }
  .dial[data-sig="go"] .dial-center { color: var(--on-go); }
  .dial[data-sig="top"] .dial-center, .dial[data-sig="impact"] .dial-center { color: var(--on-flag); }
  .dial:not([data-sig="off"]) .ratio-sub, .dial:not([data-sig="off"]) .status { color: inherit; opacity: 0.8; }
  .halo { fill: var(--flag); opacity: 0; transform-origin: 140px 140px; }
  .halo.flash { animation: flash 0.45s ease-out; }
  @keyframes flash { from { opacity: 0.28; transform: scale(0.94); } to { opacity: 0; transform: scale(1.06); } }
  .mark { fill: var(--surface); stroke: var(--muted); stroke-width: 3; }
  .mark.on { fill: var(--go); stroke: var(--surface); }
  #markTop.on, .mark.impact.on { fill: var(--flag); }
  .dial-wrap { position: relative; width: min(290px, 100%); max-width: 100%; margin: 4px auto 0; }
  .dial-wrap.bar { width: 100%; }
  .dial-wrap .dial { width: 100%; margin: 0; }
  .dial.bar { aspect-ratio: auto; height: 236px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
  .dial.bar svg { display: none; }
  .dial.bar[data-sig="ready"] { background: color-mix(in srgb, var(--go) 26%, var(--surface)); }
  .dial.bar[data-sig="go"] { background: var(--go); border-color: var(--go); }
  .dial.bar[data-sig="top"], .dial.bar[data-sig="impact"] { background: var(--flag); border-color: var(--flag); }
  .dial.bar .ratio { font-size: 60px; }
  .dial.bar #cue3 { grid-column: auto; }
  .pend { position: relative; display: block; width: 86%; height: 30px; margin: 12px 0 2px; }
  .pend-track { position: absolute; inset: 0; border-radius: 15px; background: currentColor; opacity: 0.12; }
  .pend-guide { position: absolute; top: -6px; bottom: -6px; border-left: 1px dashed currentColor; opacity: 0.6; }
  .pend-guide.imp { border-left: 1.5px solid currentColor; opacity: 1; }
  .pend-fill { position: absolute; top: 7px; bottom: 7px; left: 50%; width: 0; border-radius: 3px; background: currentColor; opacity: 0.4; }
  .pend-head { position: absolute; top: 2px; bottom: 2px; left: 50%; width: 8px; margin-left: -4px; border-radius: 3px; background: currentColor; }
  .pend-caps { position: relative; display: block; width: 86%; height: 15px; font-size: 11px; opacity: 0.75; }
  .pend-caps span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  #capL { left: 10%; } #capC { left: 50%; } #capR { left: 90%; }
  .flip { position: absolute; z-index: 2; top: 6px; right: 6px; width: 40px; height: 40px; padding: 0; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--fg); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .dial-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; pointer-events: none; }
  .ratio { font-family: var(--font-display); font-weight: 700; font-size: 84px; line-height: 0.9; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
  .ratio-sub { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .status { font-size: 12px; color: var(--muted); letter-spacing: 0.02em; margin-top: 6px; }
  .cues { display: grid; grid-template-columns: auto auto; justify-content: center; justify-items: center; gap: 5px 6px; margin-top: 10px; }
  #cue3 { grid-column: 1 / -1; }
  .cue { white-space: nowrap; }
  .cue { font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .dial:not([data-sig="off"]) .cue { border-color: currentColor; color: inherit; opacity: 0.55; }
  .dial:not([data-sig="off"]) .cue.on { opacity: 1; background: var(--surface); border-color: var(--surface); color: var(--fg); }

  /* Metrics */
  .metrics { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
  .metric { padding: 9px 4px; text-align: center; display: flex; flex-direction: column; gap: 2px; }
  .metric + .metric { border-left: 1px solid var(--line); }
  .metric span { font-size: 11px; color: var(--muted); letter-spacing: 0.04em; }
  .metric strong { font-family: var(--font-display); font-weight: 600; font-size: 20px; font-variant-numeric: tabular-nums; }
  #mBack { color: var(--go); }
  #mDown { color: var(--flag); }

  .group { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .label { font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }

  .presets { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .presets button {
    aspect-ratio: 1; max-width: 100%; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface);
    font-family: var(--font-display); font-weight: 600; font-size: 19px; cursor: pointer; font-variant-numeric: tabular-nums;
  }
  .presets.wide { grid-template-columns: 1fr 1fr; }
  .presets.wide button { aspect-ratio: auto; border-radius: 999px; padding: 12px; font-size: 22px; }
  .presets.wide button small { font-size: 14px; font-weight: 500; margin-left: 4px; opacity: 0.75; }
  .presets button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }


  /* Bluetooth sync stepper */
  .row2 { display: grid; grid-template-columns: 1fr 1.3fr; gap: 10px; }
  .sync { display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 8px 8px 8px 12px; }
  .sync-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .sync-text strong { font-size: 14px; font-weight: 500; }
  .sync-text span { font-size: 12px; color: var(--muted); }
  .stepper { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .stepper button { width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); font-size: 20px; line-height: 1; cursor: pointer; }
  .stepper label { display: flex; align-items: baseline; gap: 2px; }
  .stepper input {
    width: 3.6em; text-align: right; border: 0; background: none; font-family: var(--font-display); font-weight: 600; font-size: 22px;
    font-variant-numeric: tabular-nums; user-select: text; -webkit-user-select: text; -moz-appearance: textfield; padding: 2px 0;
  }
  .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .stepper .unit { font-size: 12px; color: var(--muted); margin-right: 4px; }

  .foot { margin-top: auto; font-size: 10px; line-height: 1.5; color: var(--muted); opacity: 0.75; text-align: center; text-wrap: balance; }
  .foot strong { color: var(--fg); font-weight: 500; }

  /* ---------- Soft 3D for the controls only. The timer (circle and putting bar) is untouched. ---------- */
  :root {
    --hi: rgba(255, 255, 255, 0.95);
    --lo: rgba(52, 76, 62, 0.17);
    --raise: 3px 4px 10px var(--lo), -3px -3px 8px var(--hi);
    --press: inset 2px 2px 5px var(--lo), inset -2px -2px 5px var(--hi);
    --accent-top: color-mix(in srgb, var(--accent) 84%, #ffffff);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --hi: rgba(255, 255, 255, 0.045); --lo: rgba(0, 0, 0, 0.55); }
  }
  :root[data-theme="dark"] { --hi: rgba(255, 255, 255, 0.045); --lo: rgba(0, 0, 0, 0.55); }

  .brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .logo { width: 28px; height: 28px; flex-shrink: 0; display: block; border-radius: 8px; box-shadow: 2px 3px 6px var(--lo); }
  h1 { font-size: clamp(17px, 5.4vw, 21px); white-space: nowrap; }

  .seg { background: var(--bg); border-color: transparent; border-radius: 13px; padding: 4px; gap: 4px; box-shadow: var(--press); }
  .seg button { border-radius: 9px; }
  .seg button[aria-pressed="true"] {
    background: linear-gradient(180deg, var(--accent-top), var(--accent));
    box-shadow: 0 2px 6px var(--lo), inset 0 1px 0 rgba(255, 255, 255, 0.3);
  }

  .presets button {
    background: linear-gradient(145deg, var(--surface), var(--bg)); border: 1px solid var(--line); box-shadow: var(--raise);
  }
  .presets button:active { box-shadow: var(--press); }
  .presets button[aria-pressed="true"] {
    background: linear-gradient(180deg, var(--accent-top), var(--accent)); border-color: transparent;
    box-shadow: var(--raise), inset 0 1px 0 rgba(255, 255, 255, 0.3);
  }

  .metrics, .sync {
    background: linear-gradient(160deg, var(--surface), color-mix(in srgb, var(--surface) 60%, var(--bg)));
    border-color: transparent; border-radius: 16px; box-shadow: var(--raise);
  }
  #mBack { color: color-mix(in srgb, var(--go) 75%, var(--fg)); }
  #mDown { color: color-mix(in srgb, var(--flag) 65%, var(--fg)); }

  .stepper button { background: linear-gradient(145deg, var(--surface), var(--bg)); border-color: transparent; box-shadow: 2px 3px 6px var(--lo), -2px -2px 5px var(--hi); }
  .stepper button:active { box-shadow: var(--press); }
  .stepper input { background: var(--bg); border-radius: 9px; box-shadow: var(--press); padding: 2px 6px; }

  /* Phone or tablet turned sideways: only the timer, as large as the screen allows. Turn back to portrait for settings.
     Kept last so these sizes win over the normal ones. Display only: timing code is unchanged. */
  @media (orientation: landscape) and (pointer: coarse) {
    html, body { overflow: hidden; }
    .app { max-width: none; height: 100%; min-height: 0; display: flex; align-items: center; justify-content: center; padding-block: 10px; }
    .app > *:not(.dial-wrap) { display: none !important; }
    .app > .dial-wrap { width: min(100%, calc(100vh - 20px)); width: min(100%, calc(100dvh - 20px)); margin: 0; }
    .app > .dial-wrap.bar { width: 100%; height: 100%; }
    .dial.bar { height: 100%; }
    .ratio { font-size: clamp(64px, 24vmin, 180px); }
    .dial.bar .ratio { font-size: clamp(56px, 20vmin, 150px); }
    .ratio-sub, .status { font-size: clamp(13px, 3.2vmin, 22px); }
    .cue { font-size: clamp(11px, 2.6vmin, 18px); padding: 0.25em 0.7em; }
    .pend { width: 88%; height: clamp(30px, 10vmin, 72px); margin-block: 2vmin 0.5vmin; }
    .pend-fill { top: 24%; bottom: 24%; }
    .pend-head { width: clamp(8px, 1.6vmin, 14px); margin-left: calc(clamp(8px, 1.6vmin, 14px) / -2); }
    .pend-caps { width: 88%; font-size: clamp(11px, 2.8vmin, 18px); height: 1.4em; }
  }

  @media (prefers-reduced-motion: reduce) { .halo.flash { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="14" fill="#0c1210"></rect>
        <circle cx="32" cy="32" r="19" fill="none" stroke="#1b2620" stroke-width="6"></circle>
        <path d="M32 13 A19 19 0 1 1 13 32" fill="none" stroke="#3ddc84" stroke-width="6"></path>
        <path d="M13 32 A19 19 0 0 1 32 13" fill="none" stroke="#ffc23d" stroke-width="6"></path>
        <circle cx="32" cy="32" r="8" fill="#ffc23d"></circle>
      </svg>
      <h1 id="appTitle">Golf Stroke Tempo</h1>
    </div>
    <div class="seg small" role="group" aria-label="Language">
      <button id="langEn" type="button" data-lang="en">EN</button>
      <button id="langJa" type="button" data-lang="ja">日本語</button>
    </div>
  </header>

  <div class="dial-wrap" id="dialWrap">
  <button class="dial" id="dial" type="button" data-sig="off">
    <svg viewBox="0 0 280 280" aria-hidden="true">
      <circle class="lamp" cx="140" cy="140" r="104"></circle>
      <circle class="halo" id="halo" cx="140" cy="140" r="104"></circle>
      <circle class="ring-track" cx="140" cy="140" r="120"></circle>
      <circle class="seg-back" id="segBack" cx="140" cy="140" r="120" transform="rotate(-90 140 140)"></circle>
      <circle class="seg-down" id="segDown" cx="140" cy="140" r="120"></circle>
      <circle class="ring-prog back" id="ringBack" cx="140" cy="140" r="120" transform="rotate(-90 140 140)"></circle>
      <circle class="ring-prog down" id="ringDown" cx="140" cy="140" r="120"></circle>
      <circle class="mark" id="markStart" cx="140" cy="20" r="7"></circle>
      <circle class="mark" id="markTop" cx="140" cy="20" r="7"></circle>
      <circle class="mark impact" id="markImpact" cx="140" cy="20" r="4"></circle>
    </svg>
    <span class="dial-center">
      <span class="ratio" id="ratio">30/10</span>
      <span class="ratio-sub" id="ratioSub"></span>
      <span class="pend" id="pend" hidden>
        <span class="pend-track"></span>
        <span class="pend-guide" style="left:10%"></span>
        <span class="pend-guide imp" style="left:50%"></span>
        <span class="pend-guide" style="left:90%"></span>
        <span class="pend-fill" id="pendFill"></span>
        <span class="pend-head" id="pendHead"></span>
      </span>
      <span class="pend-caps" id="pendCaps" hidden><span id="capL"></span><span id="capC" data-i18n="capImpact"></span><span id="capR"></span></span>
      <span class="status" id="status"></span>
      <span class="cues">
        <span class="cue" id="cue1" data-i18n="cueStart"></span>
        <span class="cue" id="cue2" data-i18n="cueTop"></span>
        <span class="cue" id="cue3" data-i18n="cueImpact"></span>
      </span>
    </span>
  </button>
  <button class="flip" id="flip" type="button" hidden>
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h12l-3-3M17 17H5l3 3"/></svg>
  </button>
  </div>

  <div class="metrics">
    <div class="metric"><span id="mBackLabel"></span><strong id="mBack"></strong></div>
    <div class="metric" id="mDownCell"><span data-i18n="mDown"></span><strong id="mDown"></strong></div>
    <div class="metric"><span data-i18n="mRest"></span><strong id="mRest"></strong></div>
    <div class="metric"><span>BPM</span><strong id="mBpm"></strong></div>
  </div>

  <div class="seg" role="group" aria-label="Mode">
    <button id="modeLong" type="button" data-mode="long" data-i18n="modeLong"></button>
    <button id="modeShort" type="button" data-mode="short" data-i18n="modeShort"></button>
    <button id="modePutt" type="button" data-mode="putt" data-i18n="modePutt"></button>
  </div>

  <div class="presets" id="presets"></div>

  <div class="row2">
    <div class="group">
      <span class="label" data-i18n="lblSound"></span>
      <div class="seg" role="group">
        <button id="soundTone" type="button" data-sound="tone" data-i18n="soundTone"></button>
        <button id="soundBeep" type="button" data-sound="beep" data-i18n="soundBeep"></button>
      </div>
    </div>
    <div class="group">
      <span class="label" data-i18n="lblRest"></span>
      <div class="seg" role="group">
        <button id="rest10" type="button" data-rest="1.0">1.0s</button>
        <button id="rest16" type="button" data-rest="1.6">1.6s</button>
        <button id="rest25" type="button" data-rest="2.5">2.5s</button>
      </div>
    </div>
  </div>

  <div class="sync">
    <div class="sync-text">
      <strong data-i18n="syncTitle"></strong>
      <span data-i18n="syncHint"></span>
    </div>
    <div class="stepper">
      <button id="leadMinus" type="button" aria-label="−10 ms">−</button>
      <label><input id="leadInput" type="number" inputmode="numeric" min="0" max="500" step="10" aria-label="Bluetooth sync (ms)"><span class="unit">ms</span></label>
      <button id="leadPlus" type="button" aria-label="+10 ms">+</button>
    </div>
  </div>

  <footer class="foot">
    <span data-i18n="footLocal"></span> <span data-i18n="footFree"></span> <span data-i18n="footThanks"></span>
  </footer>
</div>

<script>
(() => {
  const FPS = 30;
  // Long/short: [backswing frames, downswing frames] at 30 fps. Putting: BPM; beat 1 = takeaway, beat 2 = impact.
  const PRESETS = {
    long:  [[18, 6], [21, 7], [24, 8], [27, 9], [30, 10]],
    short: [[14, 7], [16, 8], [18, 9], [20, 10], [22, 11]],
    putt:  [80, 90]
  };
  const R = 120, C = 2 * Math.PI * R;
  const LEAD_MAX = 500, LEAD_STEP = 10;

  const I18N = {
    en: {
      title: 'Golf Stroke Tempo',
      tapStart: 'Tap to start', playing: 'Playing · tap to stop',
      cueStart: 'Takeaway', cueTop: 'Top', cueImpact: 'Impact',
      mBack: 'BACK', mStroke: 'STROKE', mDown: 'DOWN', mRest: 'REST',
      modeLong: 'Long game', modeShort: 'Short game', modePutt: 'Putting',
      lblSound: 'Sound', soundTone: 'Tone', soundBeep: 'Beep', lblRest: 'Rest',
      syncTitle: 'Bluetooth delay', syncHint: 'Fixes sound lag on wireless earbuds. Leave at 0 for wired or speaker.',
      footLocal: 'Runs entirely on your phone. No data is collected.',
      footFree: 'Public domain (CC0). Free to use and share.',
      footThanks: 'If it helps, let Hans know. He’d be very happy to hear it.',
      capBack: 'Back', capImpact: 'Impact', capFollow: 'Follow',
      viewRing: 'Circle view', viewBar: 'Bar view', viewLefty: 'Left-handed bar view',
      swing: 'swing', stroke: 'stroke'
    },
    ja: {
      title: 'Golf Stroke Tempo',
      tapStart: 'タップしてスタート', playing: '再生中（タップで停止）',
      cueStart: 'テークバック', cueTop: 'トップ', cueImpact: 'インパクト',
      mBack: 'バック', mStroke: 'ストローク', mDown: 'ダウン', mRest: 'インターバル',
      modeLong: 'フルショット', modeShort: 'アプローチ', modePutt: 'パター',
      lblSound: 'サウンド', soundTone: 'トーン', soundBeep: 'ビープ', lblRest: 'インターバル',
      syncTitle: '音ズレ補正（Bluetooth）', syncHint: 'ワイヤレスイヤホンの音の遅れを補正します。有線やスピーカーなら 0 のままで大丈夫です。',
      footLocal: 'すべて端末内で動作し、データは一切収集しません。',
      footFree: 'パブリックドメイン（CC0）です。ご自由にお使いください。',
      footThanks: '役に立ったら、ハンスに教えていただけるとすごく幸いです。',
      capBack: 'バック', capImpact: 'インパクト', capFollow: 'フォロー',
      viewRing: '円表示', viewBar: 'バー表示', viewLefty: 'レフティ用バー表示',
      swing: 'スイング', stroke: 'ストローク'
    }
  };

  const store = {
    get(k, d) { try { const v = localStorage.getItem('swingTempo.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('swingTempo.' + k, JSON.stringify(v)); } catch {} }
  };
  const defaultLang = (navigator.language || '').toLowerCase().startsWith('ja') ? 'ja' : 'en';
  const saved = store.get('settings', {});
  const state = {
    lang: saved.lang || defaultLang,
    mode: PRESETS[saved.mode] ? saved.mode : 'long',
    idx: Object.assign({ long: 4, short: 4, putt: 1 }, saved.idx),
    sound: saved.sound === 'beep' ? 'beep' : 'tone',
    rest: ['1.0', '1.6', '2.5'].includes(saved.rest) ? saved.rest : '1.6',
    puttView: ['ring', 'bar', 'lefty'].includes(saved.puttView) ? saved.puttView : 'ring',
    lead: saved.v === 2 && Number.isFinite(saved.lead) ? saved.lead : 0,
    playing: false
  };
  const save = () => store.set('settings', { lang: state.lang, mode: state.mode, idx: state.idx, sound: state.sound, rest: state.rest, lead: state.lead, puttView: state.puttView, v: 2 });

  const $ = id => document.getElementById(id);
  const t = k => I18N[state.lang][k];

  /* ---------- timing model ---------- */
  function timing() {
    const rest = Math.round(parseFloat(state.rest) * FPS) / FPS;
    if (state.mode === 'putt') {
      const bpm = PRESETS.putt[state.idx.putt];
      // Two beats only: takeaway, then impact one beat later (no top cue)
      return { putt: true, bpm, back: 60 / bpm, down: 0, rest };
    }
    const [x, y] = PRESETS[state.mode][state.idx[state.mode]];
    return { x, y, back: x / FPS, down: y / FPS, rest, bpm: 1800 / y };
  }

  /* ---------- audio engine: look-ahead scheduler on the AudioContext clock ---------- */
  let ctx = null, master = null, schedTimer = null, nextStart = 0, lastT2 = -Infinity;
  let cycles = [], rafId = 0, wakeLock = null;
  const liveNodes = new Set();
  const LOOKAHEAD = 1.6, TICK_MS = 25, READY = 0.8, IMPACT_HOLD = 0.35;

  function ensureAudio() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC({ latencyHint: 'interactive' });
      master = ctx.createGain();
      master.gain.value = 0.9;
      master.connect(ctx.destination);
      const b = ctx.createBuffer(1, 1, 22050), s = ctx.createBufferSource(); // iOS unlock
      s.buffer = b; s.connect(ctx.destination); s.start(0);
    }
    if (ctx.state !== 'running') ctx.resume();
  }

  // Context time reaching the speaker right now (measured output latency removed)
  function audibleNow() {
    if (ctx.getOutputTimestamp) {
      const ts = ctx.getOutputTimestamp();
      if (ts && ts.contextTime > 0 && ts.performanceTime > 0) {
        return ts.contextTime + (performance.now() - ts.performanceTime) / 1000;
      }
    }
    return ctx.currentTime - (ctx.outputLatency || 0) - (ctx.baseLatency || 0);
  }

  function tone(when, freq, dur, vol, type = 'triangle') {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(vol, when + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0008, when + dur);
    o.connect(g); g.connect(master);
    o.start(when); o.stop(when + dur + 0.02);
    liveNodes.add(o);
    o.onended = () => liveNodes.delete(o);
  }

  // Tone: soft D5 / A5. Beep: sharp square-wave beeps, higher and longer at impact.
  function scheduleCue(when, n) {
    if (state.sound === 'beep') {
      if (n === 3) tone(when, 2000, 0.11, 0.22, 'square');
      else tone(when, 1000, 0.06, 0.2, 'square');
    } else {
      if (n === 3) tone(when, 880, 0.14, 0.6);
      else tone(when, 587.33, 0.09, 0.5);
    }
  }

  function scheduler() {
    const horizon = ctx.currentTime + LOOKAHEAD;
    while (nextStart < horizon) {
      const p = timing();
      const t0 = nextStart, t1 = t0 + p.back, t2 = t1 + p.down;
      scheduleCue(t0, 1);
      if (p.down > 0) scheduleCue(t1, 2);
      scheduleCue(t2, 3);
      const room = t0 - (lastT2 + IMPACT_HOLD + 0.05);
      cycles.push({ t0, t1, t2, end: t2 + p.rest, readyStart: t0 - Math.max(0.15, Math.min(READY, room)) });
      if (cycles.length > 6) cycles.shift();
      lastT2 = t2;
      nextStart = t2 + p.rest; // next cycle is derived from audio time, so nothing drifts
    }
  }

  function silence() {
    clearInterval(schedTimer); schedTimer = null;
    liveNodes.forEach(o => { try { o.stop(); } catch {} });
    liveNodes.clear();
    cycles = [];
  }

  function startEngine() {
    silence();
    lastT2 = -Infinity;
    nextStart = ctx.currentTime + 0.15 + READY;
    scheduler();
    schedTimer = setInterval(scheduler, TICK_MS);
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(draw);
  }

  async function play() {
    ensureAudio();
    state.playing = true;
    startEngine();
    renderStatus();
    try { wakeLock = await navigator.wakeLock?.request('screen'); } catch { wakeLock = null; }
  }

  function stop() {
    state.playing = false;
    silence();
    cancelAnimationFrame(rafId);
    resetDial();
    try { wakeLock?.release(); } catch {}
    wakeLock = null;
    renderStatus();
  }

  const restart = () => { if (state.playing) startEngine(); };
  document.addEventListener('visibilitychange', () => { if (document.hidden && state.playing) stop(); });

  /* ---------- visuals, driven by the audio clock ---------- */
  const dial = $('dial'), ringBack = $('ringBack'), ringDown = $('ringDown'), halo = $('halo');
  let geomFrac = 0.75, lastSig = 'off';

  function setGeometry(frac) {
    geomFrac = frac;
    const a = frac * 2 * Math.PI - Math.PI / 2;
    $('markTop').setAttribute('cx', (140 + R * Math.cos(a)).toFixed(2));
    $('markTop').setAttribute('cy', (140 + R * Math.sin(a)).toFixed(2));
    const rot = `rotate(${(-90 + frac * 360).toFixed(3)} 140 140)`;
    $('segDown').setAttribute('transform', rot);
    ringDown.setAttribute('transform', rot);
    $('segBack').style.strokeDasharray = `${frac * C} ${C}`;
    $('segDown').style.strokeDasharray = `${(1 - frac) * C} ${C}`;
  }

  function setArcs(pb, pd, opacity) {
    ringBack.style.strokeDasharray = `${geomFrac * C * pb} ${C}`;
    ringDown.style.strokeDasharray = `${(1 - geomFrac) * C * pd} ${C}`;
    ringBack.style.opacity = ringDown.style.opacity = opacity;
  }

  function setSignal(sig) {
    if (sig === lastSig) return;
    lastSig = sig;
    dial.dataset.sig = sig;
    $('cue1').classList.toggle('on', sig === 'go');
    $('cue2').classList.toggle('on', sig === 'top');
    $('cue3').classList.toggle('on', sig === 'impact');
  }

  // Which light is showing at visual time v
  function signalAt(v) {
    for (let i = cycles.length - 1; i >= 0; i--) {
      const c = cycles[i];
      if (v < c.readyStart) continue;
      if (v < c.t0) return 'ready';
      if (v < c.t1) return 'go';
      if (v < c.t2) return 'top';
      if (v < c.t2 + IMPACT_HOLD) return 'impact';
      return 'off';
    }
    return 'off';
  }

  function setMarks(n) {
    $('markStart').classList.toggle('on', n >= 1);
    $('markTop').classList.toggle('on', n >= 2);
    $('markImpact').classList.toggle('on', n === 3);
  }

  // Putting bar views: pendulum head, 2:1 inside the beat, impact on the 2nd beep, then follow-through
  const VIEWS = ['ring', 'bar', 'lefty'];
  const PEND_A = 0.4, FOLLOW_HOLD = 0.2, RETURN = 0.35;
  let pendDir = 1, barOn = false;

  function applyView() {
    const putt = state.mode === 'putt';
    const view = putt ? state.puttView : 'ring';
    barOn = view !== 'ring';
    pendDir = view === 'lefty' ? -1 : 1; // right-handed: back goes to the right
    dial.classList.toggle('bar', barOn);
    $('dialWrap').classList.toggle('bar', barOn);
    $('pend').hidden = !barOn;
    $('pendCaps').hidden = !barOn;
    $('capL').textContent = pendDir > 0 ? t('capFollow') : t('capBack');
    $('capR').textContent = pendDir > 0 ? t('capBack') : t('capFollow');
    const flip = $('flip');
    flip.hidden = !putt;
    const next = VIEWS[(VIEWS.indexOf(state.puttView) + 1) % VIEWS.length];
    flip.setAttribute('aria-label', t({ ring: 'viewRing', bar: 'viewBar', lefty: 'viewLefty' }[next]));
    setPend(0.5);
  }

  function setPend(x) {
    $('pendHead').style.left = (x * 100) + '%';
    const f = $('pendFill');
    f.style.left = (Math.min(x, 0.5) * 100) + '%';
    f.style.width = (Math.abs(x - 0.5) * 100) + '%';
  }

  function pendAt(v, c) {
    const d = pendDir, A = PEND_A;
    if (!c) return 0.5;
    const beat = c.t2 - c.t0, back = beat * 2 / 3, fwd = beat / 3, ft = beat / 3;
    const s = v - c.t0;
    if (s < 0) return 0.5;
    if (s < back) return 0.5 + d * A * Math.sin(s / back * Math.PI / 2);
    if (s < beat) return 0.5 + d * A * Math.cos((s - back) / fwd * Math.PI / 2);
    if (s < beat + ft) return 0.5 - d * A * Math.sin((s - beat) / ft * Math.PI / 2);
    if (s < beat + ft + FOLLOW_HOLD) return 0.5 - d * A;
    const r = Math.min(1, (s - beat - ft - FOLLOW_HOLD) / RETURN);
    return 0.5 - d * A * (1 + Math.cos(r * Math.PI)) / 2;
  }

  function resetDial() {
    setPend(0.5);
    setArcs(0, 0, 1);
    setMarks(0);
    halo.classList.remove('flash');
    setSignal('off');
  }

  function draw() {
    if (!state.playing) return;
    // Bluetooth sync: hold the visuals back by the unreported wireless delay
    const v = audibleNow() - state.lead / 1000;
    setSignal(signalAt(v));
    let c = null;
    for (const cy of cycles) if (cy.t0 <= v) c = cy;
    if (barOn) { setPend(pendAt(v, c)); rafId = requestAnimationFrame(draw); return; }
    if (!c) { setArcs(0, 0, 1); setMarks(0); }
    else if (v < c.t1) { setArcs((v - c.t0) / (c.t1 - c.t0), 0, 1); setMarks(1); }
    else if (v < c.t2) { setArcs(1, (v - c.t1) / (c.t2 - c.t1), 1); setMarks(2); } // skipped in putting (t1 = t2)
    else {
      setArcs(1, 1, 1 - Math.min(1, (v - c.t2) / Math.max(0.01, c.end - c.t2)) * 0.85);
      if (v - c.t2 < IMPACT_HOLD) {
        if (!c.flashed) { c.flashed = true; halo.classList.remove('flash'); halo.getBoundingClientRect(); halo.classList.add('flash'); }
        setMarks(3);
      } else setMarks(0);
    }
    rafId = requestAnimationFrame(draw);
  }

  /* ---------- rendering ---------- */
  const fmt = s => s.toFixed(2) + 's';
  const fmtBpm = b => Number.isInteger(b) ? String(b) : b.toFixed(1);

  function renderStatus() {
    $('status').textContent = state.playing ? t('playing') : t('tapStart');
    dial.setAttribute('aria-label', $('status').textContent);
  }

  function renderPresets() {
    const box = $('presets');
    const putt = state.mode === 'putt';
    box.classList.toggle('wide', putt);
    box.innerHTML = '';
    PRESETS[state.mode].forEach((pr, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.id = `preset-${state.mode}-${i}`;
      if (putt) b.innerHTML = `${pr}<small>BPM</small>`;
      else b.textContent = `${pr[0]}/${pr[1]}`;
      b.setAttribute('aria-pressed', i === state.idx[state.mode]);
      b.addEventListener('click', () => {
        state.idx[state.mode] = i; save(); render();
        state.playing ? restart() : play();
      });
      box.appendChild(b);
    });
  }

  function render() {
    document.documentElement.lang = state.lang;
    $('appTitle').textContent = t('title');
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === state.lang));
    document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === state.mode));
    document.querySelectorAll('[data-sound]').forEach(b => b.setAttribute('aria-pressed', b.dataset.sound === state.sound));
    document.querySelectorAll('[data-rest]').forEach(b => b.setAttribute('aria-pressed', b.dataset.rest === state.rest));

    const p = timing();
    const total = fmt(p.back + p.down);
    if (p.putt) {
      $('ratio').textContent = p.bpm;
      $('ratioSub').textContent = `BPM · ${t('stroke')} ${total}`;
    } else {
      $('ratio').textContent = `${p.x}/${p.y}`;
      $('ratioSub').textContent = `${p.x / p.y}:1 · ${t('swing')} ${total}`;
    }
    $('mBackLabel').textContent = p.putt ? t('mStroke') : t('mBack');
    $('mDownCell').hidden = !!p.putt;
    $('markTop').hidden = !!p.putt;
    $('cue2').hidden = !!p.putt;
    $('mBack').textContent = fmt(p.back);
    $('mDown').textContent = fmt(p.down);
    $('mRest').textContent = fmt(p.rest);
    $('mBpm').textContent = fmtBpm(p.bpm);
    if (document.activeElement !== $('leadInput')) $('leadInput').value = state.lead;
    setGeometry(p.back / (p.back + p.down));
    applyView();
    renderPresets();
    renderStatus();
  }

  /* ---------- events ---------- */
  dial.addEventListener('click', () => state.playing ? stop() : play());
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); state.playing ? stop() : play(); }
  });
  document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => { state.lang = b.dataset.lang; save(); render(); }));
  document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => { state.mode = b.dataset.mode; save(); render(); restart(); }));
  $('flip').addEventListener('click', () => {
    state.puttView = VIEWS[(VIEWS.indexOf(state.puttView) + 1) % VIEWS.length];
    save(); applyView();
  });
  document.querySelectorAll('[data-sound]').forEach(b => b.addEventListener('click', () => { state.sound = b.dataset.sound; save(); render(); restart(); }));
  document.querySelectorAll('[data-rest]').forEach(b => b.addEventListener('click', () => { state.rest = b.dataset.rest; save(); render(); restart(); }));

  function setLead(ms) {
    const v = Math.max(0, Math.min(LEAD_MAX, Math.round(Number(ms) || 0)));
    state.lead = v;
    $('leadInput').value = v;
    save(); // visuals read state.lead live, so the beat keeps going while you tune
  }
  $('leadMinus').addEventListener('click', () => setLead(state.lead - LEAD_STEP));
  $('leadPlus').addEventListener('click', () => setLead(state.lead + LEAD_STEP));
  $('leadInput').addEventListener('change', e => setLead(e.target.value));
  $('leadInput').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });

  resetDial();
  render();
})();
</script>
<script>
  // Offline support. Runs only over https (GitHub Pages) or localhost; opening the file directly skips it.
  if ('serviceWorker' in navigator && window.isSecureContext) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
  }
</script>
</body>
